<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts: Noto Serif KR for Korean text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/stay-a-moment.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="{{ '/feed.xml' | relative_url }}">
</head>
<body class="site{% if page.class %} {{ page.class }}{% endif %}">
  <header class="site-header">
    {% include header.html %}
  </header>

  <main class="site-main">
    <div class="content">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    {% include footer.html %}
  </footer>
  <script>
    // Scroll position handling.
    //
    // The page scrolls inside `.site-main .content` (the window itself is
    // `overflow: hidden`), so the browser's native scroll restoration — which
    // only tracks the window — can't help. We save the content scroll position
    // per page and restore it on back/forward navigation, while a fresh
    // forward navigation to a new page still starts at the top.
    (function () {
      var STORAGE_PREFIX = 'scrollpos:';

      // Native restoration targets the window (which never scrolls here), so
      // turn it off to avoid it fighting our own handling.
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      function getScroller() {
        return document.querySelector('.site-main .content');
      }

      function storageKey() {
        return STORAGE_PREFIX + location.pathname;
      }

      function savePosition() {
        var el = getScroller();
        if (!el) return;
        try { sessionStorage.setItem(storageKey(), String(el.scrollTop)); } catch (e) {}
      }

      function restorePosition() {
        var el = getScroller();
        if (!el) return;
        var saved;
        try { saved = sessionStorage.getItem(storageKey()); } catch (e) { saved = null; }
        if (saved !== null) { el.scrollTop = parseInt(saved, 10) || 0; }
      }

      // True only when this load came from the browser's back/forward buttons.
      function isBackForward() {
        try {
          var nav = performance.getEntriesByType('navigation')[0];
          if (nav && nav.type) return nav.type === 'back_forward';
        } catch (e) {}
        return performance.navigation && performance.navigation.type === 2;
      }

      document.addEventListener('DOMContentLoaded', function () {
        if (isBackForward()) { restorePosition(); }

        var el = getScroller();
        if (el) {
          var ticking = false;
          el.addEventListener('scroll', function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () { savePosition(); ticking = false; });
          }, { passive: true });
        }
      });

      // pagehide fires for both a normal unload and entering the back/forward
      // cache; unlike beforeunload it does not disqualify the page from bfcache.
      window.addEventListener('pagehide', savePosition);

      window.addEventListener('pageshow', function (event) {
        // bfcache restore already keeps the content scroll intact; only a fresh
        // back/forward load needs an explicit restore (re-applied here after
        // full layout/images in case DOMContentLoaded ran too early).
        if (event.persisted) return;
        if (isBackForward()) { restorePosition(); }
      });
    })();
  </script>
</body>
</html>
